<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIMATSUBU DB - ULTRA PRECISION v7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text-main: #e0e0e0;
            --text-dim: #999;
            --border: #333;
            --success: #00e676;
            --highlight: #ffde03;
            --update-color: #ff7597;
        }

        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; font-size: 14px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* ナビゲーション */
        .main-nav { display: flex; background: #000; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .main-tab-btn { flex: 1; padding: 15px; border: none; background: none; color: var(--text-dim); font-weight: bold; cursor: pointer; }
        .main-tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: rgba(187,134,252,0.05); }

        .content-section { display: none; }
        .content-section.active { display: block; }

        /* スキル選択パネル */
        .skill-selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin: 15px 0; max-height: 200px; overflow-y: auto; padding: 10px; background: #050505; border: 1px solid var(--border); border-radius: 8px; }
        .skill-chip { padding: 6px; font-size: 0.7rem; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; cursor: pointer; text-align: center; }
        .skill-chip.selected { background: var(--primary); color: #000; font-weight: bold; }

        /* 固定枠UI */
        .lock-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 15px 0; }
        .lock-box { background: #111; padding: 8px; border-radius: 6px; border: 1px solid #333; }
        .lock-box label { display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; }
        .lock-select { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 4px; border-radius: 4px; font-size: 0.8rem; outline: none; }

        /* 結果カード */
        .result-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; position: relative; }
        .rank-label { position: absolute; top: -12px; left: 20px; background: var(--secondary); color: #000; padding: 2px 12px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        
        .combo-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .combo-item span { color: var(--text-dim); display: block; font-size: 0.65rem; }
        .combo-item div { font-size: 0.85rem; color: var(--secondary); cursor: pointer; text-decoration: underline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .active-skills-box { display: flex; flex-wrap: wrap; gap: 4px; }
        .pt-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; background: #222; color: #777; border: 1px solid #333; cursor: pointer; }
        .pt-badge.activated { background: rgba(0, 230, 118, 0.1); color: var(--success); border-color: var(--success); }
        .pt-badge.update-applied { border-color: var(--update-color); color: var(--update-color); font-weight: bold; }

        /* 図鑑用 */
        .tabs { display: flex; overflow-x: auto; gap: 5px; margin-bottom: 15px; }
        .tab-btn { padding: 8px 15px; border-radius: 4px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-dim); cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: #000; font-weight: bold; }
        .grid-container { display: none; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .grid-container.active { display: grid; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; }
        .item-name { color: var(--secondary); font-weight: bold; margin-bottom: 8px; }
        .skill-tag { display: inline-block; background: #222; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; margin: 2px; color: #ccc; border: 1px solid #333; cursor: pointer; }

        /* モーダル */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); overflow-y: auto; }
        .modal-content { background: #1a1a1a; margin: 10% auto; padding: 20px; width: 85%; max-width: 450px; border-radius: 12px; border: 1px solid var(--primary); position: relative; }
        .mastery-list { background: #000; padding: 10px; border-radius: 6px; margin-top: 10px; font-family: monospace; font-size: 0.8rem; line-height: 1.5; }
        .mastery-item { display: flex; border-bottom: 1px solid #222; padding: 2px 0; }
        .mastery-pt { color: var(--highlight); width: 70px; flex-shrink: 0; }
        .btn-main { background: var(--secondary); color:#000; border:none; padding: 12px; border-radius:6px; font-weight:bold; cursor:pointer; width: 100%; margin-top: 15px; }

        details { margin-top: 10px; border-top: 1px dashed #444; }
        summary { padding: 10px; font-size: 0.75rem; cursor: pointer; color: var(--primary); text-align: center; }
    </style>
</head>
<body>

<nav class="main-nav">
    <button class="main-tab-btn active" onclick="switchMainTab('sim-section', event)">網羅型シミュレータ</button>
    <button class="main-tab-btn" onclick="switchMainTab('list-section', event)">装備図鑑</button>
</nav>

<div class="container">
    <section id="sim-section" class="content-section active">
        <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
            <h3 style="margin-top:0; color:var(--primary);">🎯 目標スキルを選択 (最大3つ)</h3>
            <div id="skillListPanel" class="skill-selector-grid"></div>
            
            <h3 style="margin-top:20px; color:var(--primary);">🔒 装備固定 (任意)</h3>
            <div class="lock-container">
                <div class="lock-box"><label>武器</label><select id="lock-weapon" class="lock-select"><option value="">指定なし</option></select></div>
                <div class="lock-box"><label>盾</label><select id="lock-shield" class="lock-select"><option value="">指定なし</option></select></div>
                <div class="lock-box"><label>防具</label><select id="lock-armor" class="lock-select"><option value="">指定なし</option></select></div>
                <div class="lock-box"><label>アクセ</label><select id="lock-accessory" class="lock-select"><option value="">指定なし</option></select></div>
                <div class="lock-box"><label>ペット</label><select id="lock-pet" class="lock-select"><option value="">指定なし</option></select></div>
            </div>

            <button class="btn-main" onclick="runSmartScan()">網羅検索を実行</button>
        </div>
        <div id="simResultsArea" style="margin-top: 30px;"></div>
    </section>

    <section id="list-section" class="content-section">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchSubTab('weapon', event)">武器</button>
            <button class="tab-btn" onclick="switchSubTab('shield', event)">盾</button>
            <button class="tab-btn" onclick="switchSubTab('armor', event)">防具</button>
            <button class="tab-btn" onclick="switchSubTab('accessory', event)">アクセサリ</button>
            <button class="tab-btn" onclick="switchSubTab('pet', event)">ペット</button>
        </div>
        <div id="weapon" class="grid-container active"></div>
        <div id="shield" class="grid-container"></div>
        <div id="armor" class="grid-container"></div>
        <div id="accessory" class="grid-container"></div>
        <div id="pet" class="grid-container"></div>
    </section>
</div>

<div id="detailModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 id="modalTitle" style="color:var(--secondary); margin-top:0;"></h3>
        <div id="modalBody"></div>
        <button class="btn-main" onclick="closeModal()">閉じる</button>
    </div>
</div>

<script>
    let skillData = {};
    let categoryData = { weapon:[], shield:[], armor:[], accessory:[], pet:[] };
    let selectedSkills = new Set();
    const categories = ['weapon', 'shield', 'armor', 'accessory', 'pet'];
    const catLabels = { weapon:'武器', shield:'盾', armor:'防具', accessory:'アクセ', pet:'ペット' };

    function switchMainTab(id, e) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    function switchSubTab(id, e) {
        document.querySelectorAll('#list-section .grid-container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('#list-section .tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    function toggleSkill(name, el) {
        if (selectedSkills.has(name)) { selectedSkills.delete(name); el.classList.remove('selected'); }
        else if (selectedSkills.size < 3) { selectedSkills.add(name); el.classList.add('selected'); }
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

    function showSkillDetail(name) {
        const info = skillData[name];
        document.getElementById('modalTitle').innerText = `スキル：${name}`;
        document.getElementById('modalBody').innerHTML = `<p style="line-height:1.6; white-space:pre-wrap;">${info?.説明 || "説明文が登録されていません。"}</p>`;
        document.getElementById('detailModal').style.display = 'block';
    }

    function showItemDetail(cat, itemName) {
        const item = categoryData[cat].find(i => i.名称 === itemName);
        if (!item) return;
        let html = `<div>${['スキル1','スキル2','スキル3'].map(k => (item[k] && item[k]!=='-') ? `<span class="skill-tag" onclick="showSkillDetail('${item[k]}')">${item[k]}</span>` : '').join('')}</div>`;
        html += `<div class="mastery-list">`;
        ["100pt","250pt","500pt","1000pt","2500pt","3500pt","5000pt","7500pt","10000pt"].forEach(pt => {
            if(item[pt] && item[pt] !== '-') html += `<div class="mastery-item"><span class="mastery-pt">${pt}</span><span>${item[pt]}</span></div>`;
        });
        html += `</div>`;
        document.getElementById('modalTitle').innerText = item.名称;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('detailModal').style.display = 'block';
    }

    // --- インデックス＋スマートスキャンの新ロジック ---
    function runSmartScan() {
        if (selectedSkills.size === 0) return alert("スキルを選択してください");
        const targets = Array.from(selectedSkills);
        const resultsArea = document.getElementById('simResultsArea');
        resultsArea.innerHTML = "<div style='text-align:center;'>🔍 全データを解析中...</div>";

        setTimeout(() => {
            const candidates = {};
            categories.forEach(cat => {
                const lockedName = document.getElementById(`lock-${cat}`).value;
                if (lockedName) {
                    candidates[cat] = categoryData[cat].filter(i => i.名称 === lockedName);
                } else {
                    // 【全網羅】ターゲットスキルを持つ全装備を抽出
                    const hasSkill = categoryData[cat].filter(item => 
                        targets.some(t => [item.スキル1, item.スキル2, item.スキル3].includes(t))
                    );
                    // 【予備】スキルを持たないが、穴埋めとして使うためのベース装備（各カテゴリ先頭5件）
                    const baseItems = categoryData[cat].slice(0, 5);
                    candidates[cat] = [...new Set([...hasSkill, ...baseItems])];
                }
            });

            let rawPatterns = [];
            // 高速な5重ループ
            for (let w of candidates.weapon) {
                for (let s of candidates.shield) {
                    for (let a of candidates.armor) {
                        for (let ac of candidates.accessory) {
                            for (let p of candidates.pet) {
                                let counts = {};
                                [w, s, a, ac, p].forEach(item => {
                                    [item.スキル1, item.スキル2, item.スキル3].forEach(sk => {
                                        if(sk && sk !== '-') counts[sk] = (counts[sk]||0) + 1;
                                    });
                                });

                                // マスタリー+1の適用
                                let updateSkill = null;
                                const cands = Object.keys(counts).filter(k => counts[k] === 2);
                                if (cands.length > 0) {
                                    updateSkill = cands.find(k => targets.includes(k)) || cands[0];
                                    counts[updateSkill]++;
                                }

                                // 目標をすべて3pt以上で満たしているか
                                if (targets.every(t => (counts[t] || 0) >= 3)) {
                                    let activeCount = Object.values(counts).filter(v => v >= 3).length;
                                    rawPatterns.push({
                                        combo: [w, s, a, ac, p],
                                        counts, activeCount, updateSkill,
                                        key: Object.keys(counts).filter(k => counts[k] >= 3).sort().join(',')
                                    });
                                }
                            }
                        }
                    }
                }
            }

            // 結果のグルーピング
            const grouped = {};
            rawPatterns.forEach(p => {
                if(!grouped[p.key]) grouped[p.key] = { main: p, others: [] };
                else if(p.activeCount > grouped[p.key].main.activeCount) {
                    grouped[p.key].others.push(grouped[p.key].main);
                    grouped[p.key].main = p;
                } else {
                    grouped[p.key].others.push(p);
                }
            });

            const sortedGroups = Object.values(grouped).sort((a,b) => b.main.activeCount - a.main.activeCount).slice(0, 10);

            if(sortedGroups.length === 0) {
                resultsArea.innerHTML = "❌ 該当する組み合わせが見つかりませんでした。";
                return;
            }

            resultsArea.innerHTML = `<h2>🏆 検索結果 (上位${sortedGroups.length}種類の構成)</h2>` + sortedGroups.map((g, idx) => {
                const p = g.main;
                return `
                <div class="result-card">
                    <div class="rank-label">構成 ${idx+1} (${p.activeCount}スキル発動)</div>
                    <div class="combo-row">
                        ${p.combo.map((item, i) => `<div class="combo-item"><span>${catLabels[categories[i]]}</span><div onclick="showItemDetail('${categories[i]}','${item.名称}')">${item.名称}</div></div>`).join('')}
                    </div>
                    <div class="active-skills-box">
                        ${Object.entries(p.counts).sort((a,b)=>b[1]-a[1]).map(([name, pt]) => `
                            <span class="pt-badge ${pt>=3?'activated':''} ${name===p.updateSkill?'update-applied':''}" onclick="event.stopPropagation(); showSkillDetail('${name}')">
                                ${name} ${pt}pt
                            </span>
                        `).join('')}
                    </div>
                    ${g.others.length > 0 ? `
                        <details>
                            <summary>このスキル構成の別パターンを表示 (${g.others.length}件)</summary>
                            ${g.others.slice(0, 3).map(o => `
                                <div style="margin-top:10px; padding-top:10px; border-top:1px solid #333;">
                                    <div class="combo-row">${o.combo.map((item, i) => `<div class="combo-item"><span>${catLabels[categories[i]]}</span><div onclick="showItemDetail('${categories[i]}','${item.名称}')">${item.名称}</div></div>`).join('')}</div>
                                </div>
                            `).join('')}
                        </details>
                    ` : ""}
                </div>`;
            }).join('');
        }, 50);
    }

    // --- データ初期化 ---
    function loadData() {
        Papa.parse("data/skill.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                res.data.forEach(row => {
                    if(!row.名称) return;
                    skillData[row.名称.trim()] = row;
                    const chip = document.createElement('div');
                    chip.className = 'skill-chip';
                    chip.innerText = row.名称;
                    chip.onclick = () => toggleSkill(row.名称, chip);
                    document.getElementById('skillListPanel').appendChild(chip);
                });
                
                categories.forEach(cat => {
                    Papa.parse(`data/${cat}.csv`, {
                        download: true, header: true, skipEmptyLines: true,
                        complete: function(r) {
                            categoryData[cat] = r.data;
                            renderList(cat, r.data);
                            const select = document.getElementById(`lock-${cat}`);
                            r.data.forEach(item => {
                                if(item.名称) {
                                    const opt = document.createElement('option');
                                    opt.value = item.名称; opt.innerText = item.名称;
                                    select.appendChild(opt);
                                }
                            });
                        }
                    });
                });
            }
        });
    }

    function renderList(cat, data) {
        const container = document.getElementById(cat);
        container.innerHTML = data.map(row => {
            if(!row.名称) return '';
            const sks = ['スキル1','スキル2','スキル3'].map(k => row[k]).filter(v => v && v !== '-');
            return `
                <div class="item-card" onclick="showItemDetail('${cat}', '${row.名称}')">
                    <div class="item-name">${row.名称}</div>
                    <div>${sks.map(s => `<span class="skill-tag" onclick="event.stopPropagation(); showSkillDetail('${s}')">${s}</span>`).join('')}</div>
                </div>`;
        }).join('');
    }

    window.onload = loadData;
</script>
</body>
</html>
