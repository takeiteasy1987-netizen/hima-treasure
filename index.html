<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIMATSUBU TREASURE DB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border: #333;
            --success: #2ecc71;
            --error: #e74c3c;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* メインタブ（最上部固定） */
        .main-nav {
            display: flex;
            background: #1a1a1a;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .main-tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            color: var(--text-dim);
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
        }
        .main-tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background: rgba(187, 134, 252, 0.05);
        }

        /* セクション表示制御 */
        .content-section { display: none; padding-top: 20px; }
        .content-section.active { display: block; }

        /* スキルシミュレーター専用のデザイン */
        .simulator-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--border);
        }
        .sim-result-card {
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid var(--secondary);
        }

        /* 以下、既存のカード・カテゴリタブのデザインを流用 */
        .tabs { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; padding-bottom: 5px; }
        .tab-btn {
            padding: 8px 18px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 20px;
            white-space: nowrap;
        }
        .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        .grid-container { display: none; gap: 15px; grid-template-columns: 1fr; }
        .grid-container.active { display: grid; }
        @media (min-width: 600px) { .grid-container.active { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1000px) { .grid-container.active { grid-template-columns: repeat(4, 1fr); } }

        .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
        .item-name { color: var(--secondary); font-weight: bold; cursor: pointer; border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 10px; }
        .item-skills { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-btn { background: #2a2a2a; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .type-badge { font-size: 0.7rem; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 3px; font-weight: bold; color: #fff; }
        .type-A { background: var(--error); }
        .type-M { background: var(--secondary); color: #000; }
        .type-P { background: var(--primary); color: #000; }

        /* モーダル */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
        .modal-content { background: var(--card-bg); margin: 20% auto; padding: 25px; width: 85%; max-width: 400px; border-radius: 16px; position: relative; border: 1px solid var(--border); }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 1.8rem; cursor: pointer; }
    </style>
</head>
<body>

<!-- メインナビゲーション -->
<nav class="main-nav">
    <button class="main-tab-btn active" onclick="switchMainTab('list-section', event)">装備一覧</button>
    <button class="main-tab-btn" onclick="switchMainTab('sim-section', event)">スキルシミュレーター</button>
</nav>

<div class="container">

    <!-- 1. 装備一覧セクション -->
    <section id="list-section" class="content-section active">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchSubTab('weapon', event)">武器</button>
            <button class="tab-btn" onclick="switchSubTab('shield', event)">盾</button>
            <button class="tab-btn" onclick="switchSubTab('armor', event)">防具</button>
            <button class="tab-btn" onclick="switchSubTab('accessory', event)">アクセサリ</button>
            <button class="tab-btn" onclick="switchSubTab('pet', event)">ペット</button>
        </div>

        <div id="weapon" class="grid-container active"></div>
        <div id="shield" class="grid-container"></div>
        <div id="armor" class="grid-container"></div>
        <div id="accessory" class="grid-container"></div>
        <div id="pet" class="grid-container"></div>
    </section>

    <!-- 2. スキルシミュレーターセクション -->
    <section id="sim-section" class="content-section">
        <div class="simulator-box">
            <h2 style="color: var(--primary); margin-top:0;">🎯 スキル逆引きシミュレーター</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem;">
                発動させたいスキルを選択してください。<br>
                同じスキルが3つ以上揃う組み合わせを自動で抽出します。
            </p>
            <div style="display: flex; gap: 10px; margin: 20px 0;">
                <select id="skillSelector" style="width: 100%; font-size: 1rem;">
                    <option value="">スキルを選択してください...</option>
                </select>
                <button class="build-btn" onclick="buildSet()" style="background: var(--secondary); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">検索</button>
            </div>
            <div id="buildResult"></div>
        </div>
    </section>

</div>

<!-- 詳細モーダル -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:var(--primary); margin: 0 0 10px 0;"></h2>
        <div id="modalBody" style="line-height: 1.6;"></div>
    </div>
</div>

<script>
    let skillData = {};
    let allItems = [];

    // メインタブ切り替え
    function switchMainTab(sectionId, event) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // カテゴリタブ切り替え
    function switchSubTab(tabId, event) {
        document.querySelectorAll('#list-section .grid-container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('#list-section .tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function showDetail(title, content) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('detailModal').style.display = "block";
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = "none";
    }

    window.onclick = function(e) {
        if (e.target == document.getElementById('detailModal')) closeModal();
    };

    function updateSkillSelector() {
        const selector = document.getElementById('skillSelector');
        Object.keys(skillData).sort().forEach(sk => {
            const opt = document.createElement('option');
            opt.value = sk;
            opt.textContent = sk;
            selector.appendChild(opt);
        });
    }

    function buildSet() {
        const target = document.getElementById('skillSelector').value;
        const res = document.getElementById('buildResult');
        if (!target) return;

        const matches = allItems.filter(i => 
            [i['スキル1'], i['スキル2'], i['スキル3']].map(s => (s||'').trim()).includes(target)
        );

        if (matches.length === 0) {
            res.innerHTML = "<p>対象のスキルを持つ装備が見つかりませんでした。</p>";
            return;
        }

        const cats = { weapon:'武器', shield:'盾', armor:'防具', accessory:'アクセ', pet:'ペット' };
        const grouped = {};
        matches.forEach(m => {
            if (!grouped[m.type]) grouped[m.type] = [];
            grouped[m.type].push(m['名称']);
        });

        let html = `<div class="sim-result-card">`;
        html += `<div style="color:var(--secondary); font-weight:bold; margin-bottom:10px;">「${target}」所持装備リスト</div>`;
        
        Object.keys(cats).forEach(key => {
            if (grouped[key]) {
                html += `<div style="margin-bottom:5px;"><strong style="color:var(--primary)">[${cats[key]}]</strong> ${grouped[key].join(', ')}</div>`;
            }
        });

        const count = matches.length;
        html += `<div style="margin-top:15px; padding-top:10px; border-top:1px solid #444; font-weight:bold; color:${count >= 3 ? 'var(--success)' : 'var(--error)'}">`;
        html += count >= 3 ? `✅ 合計 ${count} 個発見！発動条件クリアです。` : `⚠️ 合計 ${count} 個。発動にはあと ${3-count} 個必要です。`;
        html += `</div></div>`;
        res.innerHTML = html;
    }

    function loadSkillMaster() {
        Papa.parse("data/skill.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(row => {
                    if (row['名称']) skillData[row['名称'].trim()] = row;
                });
                updateSkillSelector();
                loadAllTables();
            }
        });
    }

    function loadCSV(fileName, targetId) {
        Papa.parse(`data/${fileName}.csv`, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                const container = document.getElementById(targetId);
                if (!container) return;

                let html = '';
                data.forEach(row => {
                    if (!row['名称']) return;
                    allItems.push({ ...row, type: fileName });

                    const name = row['名称'].trim();
                    const info = `入手: ${row['入手場所'] || row['入手方法'] || '-'}`;
                    
                    html += `<div class="item-card">`;
                    html += `<div class="item-name" onclick="showDetail('${name}', '${info}')">${name}</div>`;
                    html += `<div class="item-skills">`;
                    
                    ['スキル1', 'スキル2', 'スキル3'].forEach(sk => {
                        const skName = (row[sk] || '-').trim();
                        if (skName !== '-' && skName !== '') {
                            const s = skillData[skName];
                            if (s) {
                                html += `
                                    <div class="skill-btn" onclick="showDetail('${skName}', '【種別：${s['種別']}】<br><br>${s['説明']}')">
                                        <span class="type-badge type-${s['種別']}">${s['種別']}</span>
                                        <span>${skName}</span>
                                    </div>`;
                            } else {
                                html += `<div class="skill-btn"><span>${skName}</span></div>`;
                            }
                        }
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            }
        });
    }

    function loadAllTables() {
        ['weapon', 'shield', 'armor', 'accessory', 'pet'].forEach(id => loadCSV(id, id));
    }

    window.onload = loadSkillMaster;
</script>
</body>
</html>
