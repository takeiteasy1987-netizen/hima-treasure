<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIMATSUBU TREASURE DB - EXPERT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border: #333;
            --success: #2ecc71;
            --error: #cf6679;
        }

        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.4; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* メインタブ */
        .main-nav { display: flex; background: #1a1a1a; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .main-tab-btn { flex: 1; padding: 15px; border: none; background: none; color: var(--text-dim); font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
        .main-tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: rgba(187, 134, 252, 0.05); }

        .content-section { display: none; padding-top: 20px; }
        .content-section.active { display: block; }

        /* スキル選択パネル */
        .skill-selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 15px; max-height: 250px; overflow-y: auto; padding: 10px; background: #000; border-radius: 10px; border: 1px solid var(--border); }
        .skill-chip { padding: 8px; font-size: 0.8rem; background: #222; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .skill-chip.selected { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }

        /* シミュレーション結果 */
        .result-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 25px; position: relative; border-left: 5px solid var(--secondary); }
        .rank-badge { position: absolute; top: -10px; left: 15px; background: var(--primary); color: #000; padding: 2px 12px; border-radius: 10px; font-weight: bold; font-size: 0.8rem; }
        .combo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 15px 0; }
        .combo-item { font-size: 0.8rem; padding: 10px; background: #2a2a2a; border-radius: 8px; border: 1px solid #333; }
        .active-skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        
        /* スキルバッジ */
        .active-badge { padding: 4px 10px; border-radius: 6px; background: rgba(46, 204, 113, 0.15); border: 1px solid var(--success); color: var(--success); font-size: 0.75rem; font-weight: bold; }
        .target-active { background: var(--success); color: #000; border: 1px solid #fff; } /* 選択したスキルが発動した場合 */
        .skill-lv-badge { padding: 4px 10px; border-radius: 6px; background: #333; border: 1px solid #444; color: var(--text-dim); font-size: 0.75rem; }

        /* 装備一覧スタイル */
        .tabs { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 15px; padding-bottom: 5px; }
        .tab-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-dim); cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: #000; font-weight: bold; }
        .grid-container { display: none; gap: 15px; grid-template-columns: 1fr; }
        .grid-container.active { display: grid; }
        @media (min-width: 600px) { .grid-container.active { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1000px) { .grid-container.active { grid-template-columns: repeat(4, 1fr); } }

        .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
        .item-name { color: var(--secondary); font-weight: bold; cursor: pointer; border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 10px; font-size: 1rem; }
        .skill-btn { background: #2a2a2a; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin: 2px; color: var(--text-main); }
        
        .type-badge { font-size: 0.65rem; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 3px; font-weight: bold; color: #fff; }
        .type-A { background: var(--error); }
        .type-M { background: var(--secondary); color: #000; }
        .type-P { background: var(--primary); color: #000; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
        .modal-content { background: var(--card-bg); margin: 15% auto; padding: 25px; width: 85%; max-width: 400px; border-radius: 16px; position: relative; border: 1px solid var(--border); }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 1.8rem; cursor: pointer; }
    </style>
</head>
<body>

<nav class="main-nav">
    <button class="main-tab-btn active" onclick="switchMainTab('list-section', event)">装備一覧</button>
    <button class="main-tab-btn" onclick="switchMainTab('sim-section', event)">スキルシミュレーター</button>
</nav>

<div class="container">
    <!-- 装備一覧 -->
    <section id="list-section" class="content-section active">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchSubTab('weapon', event)">武器</button>
            <button class="tab-btn" onclick="switchSubTab('shield', event)">盾</button>
            <button class="tab-btn" onclick="switchSubTab('armor', event)">防具</button>
            <button class="tab-btn" onclick="switchSubTab('accessory', event)">アクセサリ</button>
            <button class="tab-btn" onclick="switchSubTab('pet', event)">ペット</button>
        </div>
        <div id="weapon" class="grid-container active"></div>
        <div id="shield" class="grid-container"></div>
        <div id="armor" class="grid-container"></div>
        <div id="accessory" class="grid-container"></div>
        <div id="pet" class="grid-container"></div>
    </section>

    <!-- シミュレーター -->
    <section id="sim-section" class="content-section">
        <div style="background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--border);">
            <h3 style="margin-top:0; color:var(--primary);">🎯 発動させたいスキルを選択</h3>
            <p style="font-size:0.8rem; color:var(--text-dim);">※選択したスキルが「全て3つ以上揃う」組み合わせの中から、全スキルの発動数が多い順に表示します。</p>
            <div id="skillListPanel" class="skill-selector-grid"></div>
            
            <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                <button onclick="clearSelectedSkills()" style="background:none; border: 1px solid var(--border); color:var(--text-dim); padding: 10px 20px; border-radius: 8px; cursor:pointer;">リセット</button>
                <button onclick="runAdvancedSim()" style="background: var(--secondary); color:#000; border:none; padding: 12px 35px; border-radius: 8px; font-weight:bold; cursor:pointer; font-size: 1rem;">最適な構成を検索</button>
            </div>
        </div>

        <div id="simResultsArea" style="margin-top: 30px;"></div>
    </section>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:var(--primary); margin: 0;"></h2>
        <div id="modalBody" style="margin-top:20px; line-height: 1.6;"></div>
    </div>
</div>

<script>
    let skillData = {};
    let categoryData = { weapon:[], shield:[], armor:[], accessory:[], pet:[] };
    let selectedSkills = new Set();

    function switchMainTab(id, e) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    function switchSubTab(id, e) {
        document.querySelectorAll('#list-section .grid-container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('#list-section .tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    function toggleSkill(skillName, element) {
        if (selectedSkills.has(skillName)) {
            selectedSkills.delete(skillName);
            element.classList.remove('selected');
        } else {
            selectedSkills.add(skillName);
            element.classList.add('selected');
        }
    }

    function clearSelectedSkills() {
        selectedSkills.clear();
        document.querySelectorAll('.skill-chip').forEach(c => c.classList.remove('selected'));
        document.getElementById('simResultsArea').innerHTML = '';
    }

    function runAdvancedSim() {
        if (selectedSkills.size === 0) return alert("スキルを選択してください");
        const resultsArea = document.getElementById('simResultsArea');
        resultsArea.innerHTML = "<div style='text-align:center; padding:20px;'>最強の組み合わせを計算中...</div>";

        setTimeout(() => {
            const targets = Array.from(selectedSkills);
            const filtered = {};
            
            // ターゲットスキルを1つでも持っている装備を優先抽出
            Object.keys(categoryData).forEach(cat => {
                filtered[cat] = categoryData[cat].filter(item => 
                    [item['スキル1'], item['スキル2'], item['スキル3']].some(s => targets.includes(s))
                );
                if(filtered[cat].length === 0) filtered[cat] = categoryData[cat].slice(0, 30);
            });

            let patterns = [];
            // パフォーマンスのため探索範囲を絞る
            const wL = filtered.weapon.slice(0, 12);
            const sL = filtered.shield.slice(0, 12);
            const aL = filtered.armor.slice(0, 12);
            const acL = filtered.accessory.slice(0, 12);
            const pL = filtered.pet.slice(0, 12);

            for (let w of wL) {
                for (let s of sL) {
                    for (let a of aL) {
                        for (let ac of acL) {
                            for (let p of pL) {
                                const combo = [w, s, a, ac, p];
                                const counts = {};
                                combo.forEach(i => {
                                    ['スキル1','スキル2','スキル3'].forEach(k => {
                                        const sk = (i[k]||'').trim();
                                        if(sk && sk !== '-') counts[sk] = (counts[sk]||0) + 1;
                                    });
                                });

                                // ルール1: 選択したスキルが全て3つ以上揃っているか
                                const allTargetsActive = targets.every(t => (counts[t] || 0) >= 3);
                                
                                if (allTargetsActive) {
                                    // ルール3: 発動している全スキルの数をカウント
                                    let totalActiveCount = 0;
                                    Object.keys(counts).forEach(sk => {
                                        if (counts[sk] >= 3) totalActiveCount++;
                                    });

                                    patterns.push({ combo, counts, totalActiveCount });
                                }
                            }
                        }
                    }
                }
            }

            // 総発動数が多い順にソート
            patterns.sort((a,b) => b.totalActiveCount - a.totalActiveCount);
            const top5 = patterns.slice(0, 5);

            if(top5.length === 0) {
                resultsArea.innerHTML = "<div class='result-card' style='border-left-color:var(--error)'>指定したスキルを全て同時に発動できる組み合わせが見つかりませんでした。スキルの数を減らすか、別の組み合わせを試してください。</div>";
                return;
            }

            let html = `<h2 style="color:var(--secondary); margin-bottom:15px;">🏆 最適構成 TOP5</h2>`;
            top5.forEach((p, idx) => {
                html += `<div class="result-card">
                    <div class="rank-badge">RANK ${idx + 1} (全 ${p.totalActiveCount} スキル発動)</div>
                    <div class="combo-grid">
                        <div class="combo-item"><strong>武器:</strong><br>${p.combo[0].名称}</div>
                        <div class="combo-item"><strong>盾:</strong><br>${p.combo[1].名称}</div>
                        <div class="combo-item"><strong>防具:</strong><br>${p.combo[2].名称}</div>
                        <div class="combo-item"><strong>アクセ:</strong><br>${p.combo[3].名称}</div>
                        <div class="combo-item"><strong>ペット:</strong><br>${p.combo[4].名称}</div>
                    </div>
                    <div style="margin-top:15px;">
                        <div style="font-size:0.8rem; color:var(--primary); font-weight:bold; margin-bottom:8px;">📊 発動・構成スキル一覧:</div>
                        <div class="active-skills">
                            ${Object.entries(p.counts).sort((a,b) => b[1] - a[1]).map(([name, lv]) => {
                                const isActive = lv >= 3;
                                const isTarget = targets.includes(name);
                                let badgeClass = isActive ? 'active-badge' : 'skill-lv-badge';
                                if (isActive && isTarget) badgeClass += ' target-active';
                                
                                return `<span class="${badgeClass}">${name} Lv.${lv}</span>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            });
            resultsArea.innerHTML = html;
        }, 100);
    }

    function loadData() {
        Papa.parse("data/skill.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                const panel = document.getElementById('skillListPanel');
                res.data.forEach(row => {
                    if (!row['名称']) return;
                    skillData[row['名称'].trim()] = row;
                    const chip = document.createElement('div');
                    chip.className = 'skill-chip';
                    chip.innerText = row['名称'];
                    chip.onclick = () => toggleSkill(row['名称'], chip);
                    panel.appendChild(chip);
                });
                ['weapon', 'shield', 'armor', 'accessory', 'pet'].forEach(cat => {
                    Papa.parse(`data/${cat}.csv`, {
                        download: true, header: true, skipEmptyLines: true,
                        complete: function(r) {
                            categoryData[cat] = r.data;
                            renderList(cat, r.data);
                        }
                    });
                });
            }
        });
    }

    function renderList(cat, data) {
        const container = document.getElementById(cat);
        let html = '';
        data.forEach(row => {
            if (!row['名称']) return;
            html += `<div class="item-card">
                <div class="item-name" onclick="showDetail('${row['名称']}', '入手: ${row['入手場所']||row['入手方法']||'-'}')">${row['名称']}</div>
                <div class="item-skills">`;
            ['スキル1', 'スキル2', 'スキル3'].forEach(sk => {
                const name = (row[sk]||'-').trim();
                if (name !== '-' && name !== '') {
                    const s = skillData[name];
                    html += `<div class="skill-btn" onclick="showDetail('${name}', '${s?s.説明:'データなし'}')">
                        ${s?`<span class="type-badge type-${s.種別}">${s.種別}</span>`:''} ${name}
                    </div>`;
                }
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
    }

    function showDetail(t, c) {
        document.getElementById('modalTitle').innerText = t;
        document.getElementById('modalBody').innerHTML = c;
        document.getElementById('detailModal').style.display = "block";
    }
    function closeModal() { document.getElementById('detailModal').style.display = "none"; }
    window.onclick = e => { if(e.target == document.getElementById('detailModal')) closeModal(); }
    window.onload = loadData;
</script>
</body>
</html>
