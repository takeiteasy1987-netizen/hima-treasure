<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひまつぶトレジャー 攻略DB</title>
    <!-- CSVを読み込むためのライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        /* （既存のroot、bodyなどはそのまま） */
        
        /* カードが並ぶコンテナ */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px 0;
        }

        /* 1つの装備カードの基本設定 */
        .item-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            /* デフォルト（スマホ）は1列 */
            width: 100%;
            box-sizing: border-box;
        }

        /* 1行目：名称のスタイル */
        .item-name {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }

        /* 2行目：スキルを並べるエリア */
        .item-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* PC・タブレット向けのレスポンシブ設定 */
        @media (min-width: 600px) {
            .item-card { width: calc(50% - 12px); } /* 2列 */
        }
        @media (min-width: 900px) {
            .item-card { width: calc(33.3% - 12px); } /* 3列 */
        }
        @media (min-width: 1200px) {
            .item-card { width: calc(20% - 12px); } /* 5列 */
        }

        /* 既存のバッジや枠線のスタイルは流用 */
        .type-badge { /* 前回のまま */ }
        .frame-effect { /* 前回のまま。カード内でクリックしやすく微調整 */
            padding: 4px 8px;
            font-size: 0.85rem;
        }
    </style>


</head>
<body>

<div class="container">
    <h1>ひまつぶトレジャー DB</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('weapon', event)">武器</button>
        <button class="tab-btn" onclick="showTab('shield', event)">盾</button>
        <button class="tab-btn" onclick="showTab('armor', event)">防具</button>
        <button class="tab-btn" onclick="showTab('accessory', event)">アクセサリ</button>
        <button class="tab-btn" onclick="showTab('pet', event)">ペット</button>
    </div>

    <!-- 各カテゴリの表示エリア -->
    <div id="weapon" class="table-container active"><div class="loading">読み込み中...</div></div>
    <div id="shield" class="table-container"><div class="loading">読み込み中...</div></div>
    <div id="armor" class="table-container"><div class="loading">読み込み中...</div></div>
    <div id="accessory" class="table-container"><div class="loading">読み込み中...</div></div>
    <div id="pet" class="table-container"><div class="loading">読み込み中...</div></div>
</div>

<!-- モーダルHTMLはbodyの中に配置 -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">詳細情報</h2>
        <hr>
        <div id="modalBody" style="text-align: left; margin-top: 20px; line-height: 1.6;"></div>
    </div>
</div>

<script>
    const COLUMN_SETTINGS = {
        'weapon':    ['#', '名称', 'スキル1', 'スキル2', 'スキル3'],
        'shield':    ['#', '名称', 'スキル1', 'スキル2', 'スキル3'],
        'armor':     ['#', '名称', 'スキル1', 'スキル2', 'スキル3'],
        'accessory': ['#', '名称', 'スキル1', 'スキル2', 'スキル3'],
        'pet':       ['#', '名称', 'スキル1', 'スキル2', 'スキル3']
    };

    let skillData = {};

    function showDetail(title, content) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('detailModal').style.display = "block";
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = "none";
    }

    window.onclick = function(event) {
        const modal = document.getElementById('detailModal');
        if (event.target == modal) closeModal();
    };

    function showTab(tabId, event) {
        document.querySelectorAll('.table-container').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        const target = document.getElementById(tabId);
        if (target) target.classList.add('active');
        if (event && event.currentTarget) event.currentTarget.classList.add('active');
    }

    function loadSkillMaster() {
        // パスは大文字小文字に注意 (dataかDataか)
        Papa.parse("data/skill.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(row => {
                    if (row['名称']) skillData[row['名称'].trim()] = row;
                });
                loadAllTables();
            },
            error: function() {
                console.error("skill.csvの読み込みに失敗しました");
                loadAllTables(); // 失敗しても他を読み込む
            }
        });
    }

    function loadCSV(fileName, targetId) {
        Papa.parse(`data/${fileName}.csv`, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                const container = document.getElementById(targetId);
                if (!container) return;

                // テーブルではなく grid-container を作成
                let html = '<div class="grid-container">';

                data.forEach(row => {
                    const name = (row['名称'] || '-').trim();
                    const info = `入手: ${row['入手場所'] || row['入手方法'] || '-'}`;
                    
                    html += `<div class="item-card">`;
                    
                    // 1行目：名称
                    html += `<div class="item-name" onclick="showDetail('${name}', '${info}')">${name}</div>`;
                    
                    // 2行目：スキルエリア
                    html += `<div class="item-skills">`;
                    ['スキル1', 'スキル2', 'スキル3'].forEach(skKey => {
                        const cellValue = (row[skKey] || '-').trim();
                        if (cellValue !== '-') {
                            const s = skillData[cellValue];
                            if (s) {
                                const type = s['種別'] || '?';
                                const desc = s['説明'] || '説明なし';
                                html += `
                                    <span class="frame-effect" onclick="showDetail('${cellValue}', '【種別：${type}】<br><br>${desc}')">
                                        <span class="type-badge type-${type}">${type}</span>${cellValue}
                                    </span>`;
                            } else {
                                html += `<span class="frame-effect">${cellValue}</span>`;
                            }
                        }
                    });
                    html += `</div>`; // skills終わり
                    html += `</div>`; // card終わり
                });
                
                html += '</div>'; // grid-container終わり
                container.innerHTML = html;
            }
        });
    }

    function loadAllTables() {
        Object.keys(COLUMN_SETTINGS).forEach(key => loadCSV(key, key));
    }

    window.onload = loadSkillMaster;
</script>

</body>
</html>
