<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIMATSUBU DB - ULTRA PRECISION v4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text-main: #e0e0e0;
            --text-dim: #999;
            --border: #333;
            --success: #00e676;
            --highlight: #ffde03;
            --update-color: #ff7597;
        }

        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; font-size: 14px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* ナビゲーション */
        .main-nav { display: flex; background: #000; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .main-tab-btn { flex: 1; padding: 15px; border: none; background: none; color: var(--text-dim); font-weight: bold; cursor: pointer; }
        .main-tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: rgba(187,134,252,0.05); }

        .content-section { display: none; }
        .content-section.active { display: block; }

        /* スキル選択 */
        .skill-selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin: 15px 0; max-height: 200px; overflow-y: auto; padding: 10px; background: #050505; border: 1px solid var(--border); border-radius: 8px; }
        .skill-chip { padding: 6px; font-size: 0.7rem; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; cursor: pointer; text-align: center; }
        .skill-chip.selected { background: var(--primary); color: #000; font-weight: bold; }

        /* 結果カード */
        .result-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; position: relative; }
        .rank-label { position: absolute; top: -12px; left: 20px; background: var(--secondary); color: #000; padding: 2px 12px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        
        .combo-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .combo-item span { color: var(--text-dim); display: block; font-size: 0.65rem; }
        .combo-item div { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--secondary); cursor: pointer; text-decoration: underline; text-decoration-color: #444; }
        
        .active-skills-box { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
        .pt-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; background: #222; color: #777; border: 1px solid #333; cursor: pointer; }
        .pt-badge.activated { background: rgba(0, 230, 118, 0.1); color: var(--success); border-color: var(--success); }
        .pt-badge.target { border-color: var(--highlight); color: var(--highlight); }
        .pt-badge.update-applied { border-color: var(--update-color); color: var(--update-color); font-weight: bold; }

        /* 装備図鑑用 */
        .tabs { display: flex; overflow-x: auto; gap: 5px; margin-bottom: 15px; }
        .tab-btn { padding: 8px 15px; border-radius: 4px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-dim); cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: #000; font-weight: bold; }
        .grid-container { display: none; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .grid-container.active { display: grid; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; }
        .item-card:hover { border-color: var(--secondary); }
        .item-name { color: var(--secondary); font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; }
        .skill-tag { display: inline-block; background: #222; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; margin: 2px; color: #ccc; border: 1px solid #333; }

        /* モーダル */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); overflow-y: auto; }
        .modal-content { background: #1a1a1a; margin: 10% auto; padding: 20px; width: 85%; max-width: 450px; border-radius: 12px; border: 1px solid var(--primary); position: relative; }
        .modal-title { color: var(--secondary); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .mastery-list { background: #000; padding: 10px; border-radius: 6px; margin-top: 10px; font-family: monospace; font-size: 0.8rem; line-height: 1.5; }
        .mastery-item { display: flex; border-bottom: 1px solid #222; padding: 2px 0; }
        .mastery-pt { color: var(--highlight); width: 70px; flex-shrink: 0; }
        
        .btn-close { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #666; font-size: 1.5rem; cursor: pointer; }
        .btn-main { background: var(--secondary); color:#000; border:none; padding: 12px; border-radius:6px; font-weight:bold; cursor:pointer; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

<nav class="main-nav">
    <button class="main-tab-btn active" onclick="switchMainTab('sim-section', event)">最強逆引きシミュ</button>
    <button class="main-tab-btn" onclick="switchMainTab('list-section', event)">装備図鑑</button>
</nav>

<div class="container">
    <section id="sim-section" class="content-section active">
        <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
            <h3 style="margin-top:0; color:var(--primary); font-size: 1rem;">🎯 目標スキル(3つ)を選択</h3>
            <div id="skillListPanel" class="skill-selector-grid"></div>
            <button class="btn-main" onclick="runUltimateSim()">全組み合わせから最強を検索</button>
        </div>
        <div id="simResultsArea" style="margin-top: 30px;"></div>
    </section>

    <section id="list-section" class="content-section">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchSubTab('weapon', event)">武器</button>
            <button class="tab-btn" onclick="switchSubTab('shield', event)">盾</button>
            <button class="tab-btn" onclick="switchSubTab('armor', event)">防具</button>
            <button class="tab-btn" onclick="switchSubTab('accessory', event)">アクセサリ</button>
            <button class="tab-btn" onclick="switchSubTab('pet', event)">ペット</button>
        </div>
        <div id="weapon" class="grid-container active"></div>
        <div id="shield" class="grid-container"></div>
        <div id="armor" class="grid-container"></div>
        <div id="accessory" class="grid-container"></div>
        <div id="pet" class="grid-container"></div>
    </section>
</div>

<!-- 詳細モーダル -->
<div id="detailModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="btn-close" onclick="closeModal()">&times;</button>
        <h3 id="modalTitle" class="modal-title"></h3>
        <div id="modalBody"></div>
        <button class="btn-main" onclick="closeModal()">閉じる</button>
    </div>
</div>

<script>
    let skillData = {};
    let categoryData = { weapon:[], shield:[], armor:[], accessory:[], pet:[] };
    let selectedSkills = new Set();
    const masteryPts = ["100pt", "250pt", "500pt", "1000pt", "2500pt", "3500pt", "5000pt", "7500pt", "10000pt"];

    function switchMainTab(id, e) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    function switchSubTab(id, e) {
        document.querySelectorAll('#list-section .grid-container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('#list-section .tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    function toggleSkill(name, el) {
        if (selectedSkills.has(name)) { selectedSkills.delete(name); el.classList.remove('selected'); }
        else if (selectedSkills.size < 3) { selectedSkills.add(name); el.classList.add('selected'); }
    }

    // --- 詳細表示ロジック ---

    function showSkillDetail(name) {
        const info = skillData[name];
        document.getElementById('modalTitle').innerText = `スキル：${name}`;
        document.getElementById('modalBody').innerHTML = `
            <p style="color:var(--text-main); font-size:1rem; line-height:1.6;">
                ${info && info['説明'] ? info['説明'] : "説明文が登録されていません。"}
            </p>
        `;
        document.getElementById('detailModal').style.display = 'block';
    }

    function showItemDetail(cat, itemName) {
        const item = categoryData[cat].find(i => i.名称 === itemName);
        if (!item) return;

        let html = `<div style="margin-bottom:15px;">`;
        ['スキル1', 'スキル2', 'スキル3'].forEach(k => {
            const sName = item[k];
            if (sName && sName !== '-') {
                html += `<span class="skill-tag" onclick="showSkillDetail('${sName}')">${sName}</span>`;
            }
        });
        html += `</div><div style="font-weight:bold; color:var(--primary); font-size:0.8rem; margin-top:15px;">🛡️ マスタリースキル</div><div class="mastery-list">`;
        
        masteryPts.forEach(pt => {
            const skill = item[pt];
            if (skill && skill !== '-') {
                html += `<div class="mastery-item"><span class="mastery-pt">${pt}</span><span>${skill}</span></div>`;
            }
        });
        html += `</div>`;

        document.getElementById('modalTitle').innerText = item.名称;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('detailModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

    // --- シミュレーション & HTML生成 ---

    function createResultCardHTML(p, targets, title = "") {
        const cats = ['weapon', 'shield', 'armor', 'accessory', 'pet'];
        const catLabels = ['武器', '盾', '防具', 'アクセサリ', 'ペット'];

        return `
            <div class="result-card">
                ${title ? `<div class="rank-label">${title}</div>` : ""}
                <div class="combo-row">
                    ${p.combo.map((item, i) => `
                        <div class="combo-item">
                            <span>${catLabels[i]}</span>
                            <div onclick="showItemDetail('${cats[i]}', '${item.名称}')">${item.名称}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="active-skills-box">
                    ${Object.entries(p.counts).sort((a,b) => b[1]-a[1]).map(([name, pt]) => {
                        const isAct = pt >= 3, isTar = targets.includes(name), isUp = name === p.updateAppliedSkill;
                        let cls = "pt-badge" + (isAct?" activated":"") + (isTar?" target":"") + (isUp?" update-applied":"");
                        return `<span class="${cls}" onclick="showSkillDetail('${name}')">${name} ${pt}pt${isUp?'(+1)':''}</span>`;
                    }).join('')}
                </div>
            </div>`;
    }

    function runUltimateSim() {
        if (selectedSkills.size === 0) return alert("スキルを選択してください");
        const resultsArea = document.getElementById('simResultsArea');
        resultsArea.innerHTML = "<div style='text-align:center;'>全組み合わせを計算中...</div>";

        setTimeout(() => {
            const targets = Array.from(selectedSkills);
            let rawPatterns = [];
            const filtered = {};
            Object.keys(categoryData).forEach(cat => {
                filtered[cat] = categoryData[cat].filter(item => ['スキル1','スキル2','スキル3'].some(k => targets.includes(item[k])));
                if(filtered[cat].length < 12) filtered[cat] = categoryData[cat].slice(0, 15);
            });

            for (let w of filtered.weapon) {
                for (let s of filtered.shield) {
                    for (let a of filtered.armor) {
                        for (let ac of filtered.accessory) {
                            for (let p of filtered.pet) {
                                let counts = {};
                                [w, s, a, ac, p].forEach(item => {
                                    ['スキル1','スキル2','スキル3'].forEach(k => {
                                        const n = (item[k]||'').trim();
                                        if(n && n !== '-') counts[n] = (counts[n]||0) + 1;
                                    });
                                });
                                let updateAppliedSkill = null;
                                const cands = Object.keys(counts).filter(k => counts[k] === 2);
                                if (cands.length > 0) {
                                    updateAppliedSkill = cands.find(k => targets.includes(k)) || cands[0];
                                    counts[updateAppliedSkill]++;
                                }
                                if (targets.every(t => (counts[t] || 0) >= 3)) {
                                    let activeCount = 0;
                                    Object.keys(counts).forEach(k => { if(counts[k] >= 3) activeCount++; });
                                    rawPatterns.push({ combo: [w, s, a, ac, p], counts, activeCount, updateAppliedSkill,
                                        skillKey: Object.keys(counts).filter(k => counts[k] >= 3).sort().join(',')
                                    });
                                }
                            }
                        }
                    }
                }
            }

            const grouped = {};
            rawPatterns.forEach(p => {
                if (!grouped[p.skillKey]) grouped[p.skillKey] = [];
                grouped[p.skillKey].push(p);
            });

            let uniquePatterns = Object.values(grouped).map(group => {
                group.sort((a,b) => b.activeCount - a.activeCount);
                return { main: group[0], others: group.slice(1) };
            });

            uniquePatterns.sort((a,b) => b.main.activeCount - a.main.activeCount);
            const top5 = uniquePatterns.slice(0, 5);

            if(top5.length === 0) {
                resultsArea.innerHTML = "条件に合う構成が見つかりませんでした。";
                return;
            }

            let html = `<h2>🏆 スキル構成別ランキング TOP5</h2>`;
            top5.forEach((up, idx) => {
                html += createResultCardHTML(up.main, targets, `順位 ${idx+1} (${up.main.activeCount}個発動)`);
                if (up.others.length > 0) {
                    html += `<details>
                        <summary>同じスキル構成の他装備例 (${up.others.length}件) を表示</summary>
                        <div style="padding-left:15px; border-left: 2px solid #333; margin-top:10px;">
                            ${up.others.slice(0, 5).map(o => createResultCardHTML(o, targets)).join('')}
                        </div>
                    </details>`;
                }
            });
            resultsArea.innerHTML = html;
        }, 50);
    }

    function loadData() {
        Papa.parse("data/skill.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                const panel = document.getElementById('skillListPanel');
                res.data.forEach(row => {
                    if (!row['名称']) return;
                    skillData[row['名称'].trim()] = row;
                    const chip = document.createElement('div');
                    chip.className = 'skill-chip';
                    chip.innerText = row['名称'];
                    chip.onclick = () => toggleSkill(row['名称'], chip);
                    panel.appendChild(chip);
                });
                ['weapon', 'shield', 'armor', 'accessory', 'pet'].forEach(cat => {
                    Papa.parse(`data/${cat}.csv`, {
                        download: true, header: true, skipEmptyLines: true,
                        complete: function(r) {
                            categoryData[cat] = r.data;
                            renderList(cat, r.data);
                        }
                    });
                });
            }
        });
    }

    function renderList(cat, data) {
        const container = document.getElementById(cat);
        container.innerHTML = data.map(row => {
            if (!row['名称']) return '';
            const sks = ['スキル1','スキル2','スキル3'].map(k => row[k]).filter(v => v && v !== '-');
            return `<div class="item-card" onclick="showItemDetail('${cat}', '${row['名称']}')">
                <div class="item-name">${row['名称']}</div>
                <div>${sks.map(s => `<span class="skill-tag">${s}</span>`).join('')}</div>
            </div>`;
        }).join('');
    }

    window.onload = loadData;
</script>
</body>
</html>
