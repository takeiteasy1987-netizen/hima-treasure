<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIMATSUBU TREASURE DB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border: #333;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); font-size: 1.5rem; margin-bottom: 20px; }

        /* タブメニュー */
        .tabs {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 8px;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #000;
            font-weight: bold;
        }

        /* グリッドレイアウト（初期状態は非表示） */
        .grid-container {
            display: none; /* JSで active なものだけ表示 */
            gap: 15px;
            grid-template-columns: 1fr;
        }
        .grid-container.active {
            display: grid;
        }

        @media (min-width: 600px)  { .grid-container.active { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px)  { .grid-container.active { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1200px) { .grid-container.active { grid-template-columns: repeat(5, 1fr); } }

        /* カードと詳細 */
        .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .item-name { color: var(--secondary); font-weight: bold; cursor: pointer; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .item-skills { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-btn { background: #2a2a2a; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .type-badge { font-size: 0.7rem; width: 16px; height: 16px; text-align: center; border-radius: 3px; font-weight: bold; color: #fff; }
        .type-A { background: #cf6679; }
        .type-M { background: #03dac6; color: #000; }
        .type-P { background: #bb86fc; color: #000; }

        /* モーダル */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card-bg); margin: 20% auto; padding: 25px; width: 80%; max-width: 400px; border-radius: 15px; position: relative; border: 1px solid var(--border); }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>HIMATSUBU TREASURE DB</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('weapon', event)">武器</button>
        <button class="tab-btn" onclick="showTab('shield', event)">盾</button>
        <button class="tab-btn" onclick="showTab('armor', event)">防具</button>
        <button class="tab-btn" onclick="showTab('accessory', event)">アクセサリ</button>
        <button class="tab-btn" onclick="showTab('pet', event)">ペット</button>
    </div>

    <!-- 各カテゴリ。idは必ずタブの引数と合わせる -->
    <div id="weapon" class="grid-container active"></div>
    <div id="shield" class="grid-container"></div>
    <div id="armor" class="grid-container"></div>
    <div id="accessory" class="grid-container"></div>
    <div id="pet" class="grid-container"></div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:var(--primary); margin: 0 0 10px 0;"></h2>
        <div id="modalBody" style="line-height: 1.6;"></div>
    </div>
</div>

<script>
    let skillData = {};

    function showDetail(title, content) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('detailModal').style.display = "block";
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = "none";
    }

    window.onclick = function(e) {
        if (e.target == document.getElementById('detailModal')) closeModal();
    };

    // タブ切り替えのメイン処理
    function showTab(tabId, event) {
        // 全てのコンテンツを非表示にする
        const containers = document.querySelectorAll('.grid-container');
        containers.forEach(c => {
            c.classList.remove('active');
        });

        // 全てのボタンのactiveを外す
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(b => b.classList.remove('active'));

        // 選択されたものだけ表示
        document.getElementById(tabId).classList.add('active');
        if (event) event.currentTarget.classList.add('active');
    }

    function loadSkillMaster() {
        Papa.parse("data/skill.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(row => {
                    if (row['名称']) skillData[row['名称'].trim()] = row;
                });
                loadAllTables();
            }
        });
    }

    function loadCSV(fileName, targetId) {
        Papa.parse(`data/${fileName}.csv`, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                const container = document.getElementById(targetId);
                if (!container) return;

                let html = '';
                data.forEach(row => {
                    const name = (row['名称'] || '-').trim();
                    const info = `入手: ${row['入手場所'] || row['入手方法'] || '-'}`;
                    
                    html += `<div class="item-card">`;
                    html += `<div class="item-name" onclick="showDetail('${name}', '${info}')">${name}</div>`;
                    html += `<div class="item-skills">`;
                    
                    ['スキル1', 'スキル2', 'スキル3'].forEach(skKey => {
                        const skName = (row[skKey] || '-').trim();
                        if (skName !== '-') {
                            const s = skillData[skName];
                            if (s) {
                                const type = s['種別'] || '?';
                                const desc = s['説明'] || '説明なし';
                                html += `
                                    <div class="skill-btn" onclick="showDetail('${skName}', '【種別：${type}】<br><br>${desc}')">
                                        <span class="type-badge type-${type}">${type}</span>
                                        <span>${skName}</span>
                                    </div>`;
                            } else {
                                html += `<div class="skill-btn"><span>${skName}</span></div>`;
                            }
                        }
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            }
        });
    }

    function loadAllTables() {
        ['weapon', 'shield', 'armor', 'accessory', 'pet'].forEach(id => loadCSV(id, id));
    }

    window.onload = loadSkillMaster;
</script>
</body>
</html>
