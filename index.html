<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひまつぶトレジャー 攻略DB</title>
    <style>
        :root { --primary: #3498db; --bg: #f4f7f6; }
        body { font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; font-size: 1.5rem; }
        
        /* タブ切り替えのスタイル */
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 10px 15px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 0.9rem; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        /* テーブルのスタイル */
        .table-container { display: none; overflow-x: auto; }
        .table-container.active { display: block; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #f8f9fa; color: #666; font-size: 0.85rem; }
        tr:hover { background: #fafafa; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; background: #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>ひまつぶトレジャー データベース</h1>

    <!-- タブボタン -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('weapon')">武器</button>
        <button class="tab-btn" onclick="showTab('shield')">盾</button>
        <button class="tab-btn" onclick="showTab('job')">ジョブ</button>
        <button class="tab-btn" onclick="showTab('accessory')">アクセサリ</button>
        <button class="tab-btn" onclick="showTab('monster')">モンスター</button>
    </div>

    <!-- 武器テーブル -->
    <div id="weapon" class="table-container active">
        <table>
            <thead><tr><th>名前</th><th>ATK</th><th>スキル</th><th>入手場所</th></tr></thead>
            <tbody>
                <tr><td>ひのきの棒</td><td>5</td><td><span class="tag">なし</span></td><td>はじまりの草原</td></tr>
                <tr><td>鉄の剣</td><td>15</td><td><span class="tag">強撃</span></td><td>平原の洞窟</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 盾テーブル -->
    <div id="shield" class="table-container">
        <table>
            <thead><tr><th>名前</th><th>DEF</th><th>スキル</th><th>入手場所</th></tr></thead>
            <tbody>
                <tr><td>なべのふた</td><td>3</td><td><span class="tag">なし</span></td><td>村の店</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ジョブ、アクセサリ、モンスターも同様に続く...（中身は空にしておきます） -->
    <div id="job" class="table-container"><p>ジョブ一覧を表示予定...</p></div>
    <div id="accessory" class="table-container"><p>アクセサリ一覧を表示予定...</p></div>
    <div id="monster" class="table-container"><p>モンスター一覧を表示予定...</p></div>

</div>

<script>
    function showTab(tabId) {
        // すべてのタブとコンテンツを非活性化
        document.querySelectorAll('.table-container').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        // 選択されたタブを表示
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>

</body>
</html>
