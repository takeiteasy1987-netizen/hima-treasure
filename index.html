<script>
    // --- 設定：ここで表示したい列（ヘッダー名）を正確に指定します ---
    const COLUMN_SETTINGS = {
        'weapon':    ['名称', 'スキル1', 'スキル2', 'スキル3'],
        'shield':    ['名称', 'スキル1', 'スキル2', 'スキル3'],
        'armor':     ['名称', 'スキル1', 'スキル2', 'スキル3'],
        'accessory': ['名称', 'スキル1', 'スキル2', 'スキル3'],
        'pet':       ['名称', 'スキル1', 'スキル2', 'スキル3']
    };

    // タブ切り替え機能
    function showTab(tabId) {
        document.querySelectorAll('.table-container').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        // クリックされたボタンをアクティブにする
        event.currentTarget.classList.add('active');
    }

    // CSVを読み込んで表を作る関数
    function loadCSV(fileName, targetId) {
        Papa.parse(`Data/${fileName}.csv`, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                const container = document.getElementById(targetId);
                const targetColumns = COLUMN_SETTINGS[targetId]; // 固定列の設定を取得
                
                if (data.length === 0) {
                    container.innerHTML = "<p>データがありません。</p>";
                    return;
                }

                // テーブルの組み立て
                let html = '<table><thead><tr>';
                
                // 1. 固定されたヘッダーを作成
                targetColumns.forEach(colName => {
                    html += `<th>${colName}</th>`;
                });
                html += '</tr></thead><tbody>';

                // 2. データの行を作成（固定列に指定したものだけを抽出）
                data.forEach(row => {
                    html += '<tr>';
                    targetColumns.forEach(colName => {
                        // CSVの列名と一致するデータを取得。なければ「-」を表示
                        const cellValue = row[colName.trim()]; 
                        html += `<td>${cellValue !== undefined ? cellValue : '-'}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                
                container.innerHTML = html;
            },
            error: function() {
                document.getElementById(targetId).innerHTML = "<p>CSV読み込み失敗。ファイル名やフォルダ構成を確認してください。</p>";
            }
        });
    }

    // 起動時に実行
    window.onload = function() {
        loadCSV('weapon', 'weapon');
        loadCSV('shield', 'shield');
        loadCSV('armor', 'armor');
        loadCSV('accessory', 'accessory');
        loadCSV('pet', 'pet');
    };
</script>
